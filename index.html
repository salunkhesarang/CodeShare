<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login / Register - CodeShare</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="auth-container">
        <div class="auth-logo">
    <img src="codeshare-logo.png" alt="CodeShare Logo">
</div>

        <!-- ==================================================
             ALERT
        =================================================== -->

        <div
            id="auth-alert"
            class="alert-box"
            style="display:none;"
        ></div>


        <!-- ==================================================
             LOGIN FORM
        =================================================== -->

        <div id="login-form">

            <h2>Please Login In Website</h2>

            <form id="loginForm">

                <label for="login-email">
                    Email ID:
                </label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="Enter Your Email"
                    autocomplete="email"
                    required
                >


                <label for="login-pass">
                    Password:
                </label>

                <input
                    type="password"
                    id="login-pass"
                    placeholder="Enter Your Password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    id="login-btn"
                    class="btn btn-primary btn-block"
                >
                    LOGIN
                </button>

            </form>


            <p class="auth-switch">

                create a new account

                <a
                    href="#"
                    id="show-register"
                >
                    Register
                </a>

            </p>

        </div>



        <!-- ==================================================
             REGISTER FORM
        =================================================== -->

        <div
            id="register-form"
            style="display:none;"
        >

            <h2>Create Your New Account</h2>

            <form id="registerForm">

                <label for="reg-email">
                    Email ID:
                </label>

                <input
                    type="email"
                    id="reg-email"
                    placeholder="Enter Your Email"
                    autocomplete="email"
                    required
                >


                <label for="reg-pass">
                    Password (Min 6 chars):
                </label>

                <input
                    type="password"
                    id="reg-pass"
                    placeholder="Enter Your Password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >


                <button
                    type="submit"
                    id="reg-btn"
                    class="btn btn-primary btn-block"
                >
                    REGISTER
                </button>

            </form>


            <p class="auth-switch">

                Pehle se account hai?

                <a
                    href="#"
                    id="show-login"
                >
                    Login Karein
                </a>

            </p>

        </div>

    </div>


    <!-- ==================================================
         AUTH JAVASCRIPT
    =================================================== -->

    <script type="module" src="auth.js"></script>
    <script type="module" src="security.js"></script>
    <script type="module" src="alert.js"></script>

</body>

</html>
